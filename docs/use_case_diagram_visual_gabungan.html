<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case Diagram Gabungan</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f4f6;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }
        header {
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid #d1d5db;
        }
        h1 {
            margin: 0;
            font-size: 20px;
        }
        .hint {
            margin-top: 5px;
            color: #555;
            font-size: 13px;
        }
        .page {
            width: 1320px;
            margin: 20px auto;
            padding: 14px;
            background: #fff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        .page-title {
            margin: 0 0 8px;
            text-align: center;
            font-size: 19px;
            font-weight: 700;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
            background: #fff;
        }
        .boundary {
            fill: #fff;
            stroke: #000;
            stroke-width: 2;
        }
        .boundary-label {
            font-size: 15px;
            font-weight: 700;
            text-anchor: middle;
        }
        .actor-line,
        .assoc-line,
        .dep-line,
        .general-line {
            stroke: #000;
            fill: none;
        }
        .actor-line { stroke-width: 1.8; }
        .assoc-line { stroke-width: 1.05; }
        .general-line { stroke-width: 1.1; marker-end: url(#openArrow); }
        .dep-line {
            stroke-width: 1;
            stroke-dasharray: 5 4;
            marker-end: url(#arrow);
        }
        .usecase ellipse {
            fill: #fff;
            stroke: #000;
            stroke-width: 1.25;
        }
        .usecase text {
            font-size: 10px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .actor-label {
            font-size: 10.5px;
            font-weight: 700;
            text-anchor: middle;
        }
        .relation-label {
            font-size: 9.5px;
            font-style: italic;
            fill: #111;
            text-anchor: middle;
        }
        .section-label {
            font-size: 11px;
            font-weight: 700;
            fill: #333;
            text-anchor: middle;
        }
        @media print {
            body { background: #fff; }
            header { display: none; }
            .page {
                width: 100%;
                margin: 0;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
