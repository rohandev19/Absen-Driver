        .dep-line {

        .usecase ellipse {
            fill: #fff;
            stroke: #000;
            stroke-width: 1.35;
        }
        .usecase text {
            font-size: 9.5px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .actor-label {
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
        }
        .relation-label {
            font-size: 10px;
            font-style: italic;
            fill: #111;
            text-anchor: middle;
        }
        @media print {
            body { background: #fff; }
            header { display: none; }
            .page {

                border: none;
                box-shadow: none;

</head>

<script>
    const usecaseEllipses = Array.from(document.querySelectorAll('.usecase ellipse')).map((ellipse) => {
        const originalRx = Number(ellipse.getAttribute('rx'));
        const originalRy = Number(ellipse.getAttribute('ry'));
        const scaledRx = Math.round(originalRx * 0.68);
        const scaledRy = Math.round(originalRy * 0.72);

        ellipse.setAttribute('rx', scaledRx);
        ellipse.setAttribute('ry', scaledRy);

        return {
            ellipse,
            cx: Number(ellipse.getAttribute('cx')),
            cy: Number(ellipse.getAttribute('cy')),
            originalRx,
            originalRy,
            scaledRx,
            scaledRy,
            svg: ellipse.ownerSVGElement,
        };
    });

    function nearestOriginalEllipse(svg, x, y) {
        let selected = null;
        let bestScore = Infinity;

        for (const item of usecaseEllipses) {
            if (item.svg !== svg) continue;

            const nx = (x - item.cx) / item.originalRx;
            const ny = (y - item.cy) / item.originalRy;
            const normalizedDistance = Math.sqrt(nx * nx + ny * ny);
            const score = Math.abs(normalizedDistance - 1);

            if (normalizedDistance <= 1.45 && score < bestScore) {
                selected = item;
                bestScore = score;
            }
        }

        return selected;
    }

    function boundaryPoint(item, otherX, otherY) {
        const dx = otherX - item.cx;
        const dy = otherY - item.cy;
        const denominator = Math.sqrt(
            (dx * dx) / (item.scaledRx * item.scaledRx)
            + (dy * dy) / (item.scaledRy * item.scaledRy)
        );

        if (!denominator) {
            return { x: item.cx, y: item.cy };
        }

        const t = 1 / denominator;
        return {
            x: item.cx + dx * t,
            y: item.cy + dy * t,
        };
    }

    document.querySelectorAll('line.assoc-line, line.dep-line').forEach((line) => {
        const svg = line.ownerSVGElement;
        const x1 = Number(line.getAttribute('x1'));
        const y1 = Number(line.getAttribute('y1'));
        const x2 = Number(line.getAttribute('x2'));
        const y2 = Number(line.getAttribute('y2'));

        const startEllipse = nearestOriginalEllipse(svg, x1, y1);
        const endEllipse = nearestOriginalEllipse(svg, x2, y2);

        if (startEllipse) {
            const point = boundaryPoint(startEllipse, x2, y2);
            line.setAttribute('x1', point.x.toFixed(1));
            line.setAttribute('y1', point.y.toFixed(1));
        }

        if (endEllipse) {
            const point = boundaryPoint(endEllipse, x1, y1);
            line.setAttribute('x2', point.x.toFixed(1));
            line.setAttribute('y2', point.y.toFixed(1));
        }
    });

    document.querySelectorAll('svg').forEach((svg) => {
        svg.querySelectorAll('.usecase').forEach((usecase) => {
            svg.appendChild(usecase);
        });
    });
</script>
</body>
</html>
