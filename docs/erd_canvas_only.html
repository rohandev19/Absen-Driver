function tw(s,f){return String(s).length*f*0.54}
function ellipse(cx,cy,rx,ry){g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2)}
function diamond(cx,cy,hw,hh){g.beginPath();g.moveTo(cx,cy-hh);g.lineTo(cx+hw,cy);g.lineTo(cx,cy+hh);g.lineTo(cx-hw,cy);g.closePath()}

function ge(id){return E.find(e=>e.id===id)}
function ep(e,to){
    const s=entitySize(e),dx=to.x-e.x,dy=to.y-e.y;
    if(Math.abs(dx)/s.w>Math.abs(dy)/s.h)return {x:e.x+(dx>=0?s.w/2:-s.w/2),y:e.y};
    return {x:e.x,y:e.y+(dy>=0?s.h/2:-s.h/2)};
}
function dp(d,to){
    const dx=to.x-d.x,dy=to.y-d.y;
    if(Math.abs(dx)>Math.abs(dy))return {x:d.x+(dx>=0?d.hw:-d.hw),y:d.y};
    return {x:d.x,y:d.y+(dy>=0?d.hh:-d.hh)};
}
function relBox(r){return {x:r.d[0],y:r.d[1],hw:Math.max(tw(r.l,REL_SIZE)+REL_PAD,REL_MIN)/2,hh:REL_DH}}
function sideOf(e,to){
    const s=entitySize(e),dx=to.x-e.x,dy=to.y-e.y;
    if(Math.abs(dx)/s.w>Math.abs(dy)/s.h)return dx>=0?'right':'left';
    return dy>=0?'bottom':'top';
}
function buildPortSlots(){
    const buckets={},slots={};
    R.forEach((r,i)=>{
        [['f',ge(r.f)],['t',ge(r.t)]].forEach(([end,e])=>{
            const d=relBox(r),side=sideOf(e,d),key=`${e.id}:${side}`;
            if(!buckets[key])buckets[key]=[];
            buckets[key].push({i,end,e,side,target:d});
        });
    });
    Object.values(buckets).forEach(items=>{
        const side=items[0].side,e=items[0].e,s=entitySize(e);
        items.sort((a,b)=>(side==='top'||side==='bottom')?a.target.x-b.target.x:a.target.y-b.target.y);
        const maxSpan=(side==='top'||side==='bottom')?Math.max(0,s.w-22):Math.max(0,s.h-8);
        const natural=(items.length-1)*12;
        const span=Math.min(maxSpan,natural);
        items.forEach((item,idx)=>{
            slots[`${item.i}:${item.end}`]=items.length===1?0:(idx-(items.length-1)/2)*(span/(items.length-1));
        });
    });
    return slots;
}
function endpointFor(r,i,end,d,ports){
    const e=ge(end==='f'?r.f:r.t),s=entitySize(e),side=sideOf(e,d),offset=ports[`${i}:${end}`]||0;
    if(side==='right')return {x:e.x+s.w/2,y:e.y+offset};
    if(side==='left')return {x:e.x-s.w/2,y:e.y+offset};
    if(side==='bottom')return {x:e.x+offset,y:e.y+s.h/2};
    return {x:e.x+offset,y:e.y-s.h/2};
}
function drawPath(points){
    g.beginPath();
    g.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++)g.lineTo(points[i].x,points[i].y);
    g.stroke();
}
function stepPath(a,b,mode){
    const pts=[a];
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(mode==='hv')pts.push({x:b.x,y:a.y});
    else if(mode==='vh')pts.push({x:a.x,y:b.y});
    else if(mode==='vhL')pts.push({x:a.x-28,y:a.y},{x:a.x-28,y:b.y});
    else if(mode==='vhR')pts.push({x:a.x+28,y:a.y},{x:a.x+28,y:b.y});
    else if(mode==='vhR2')pts.push({x:a.x,y:a.y+18},{x:a.x+28,y:a.y+18},{x:a.x+28,y:b.y});
    else if(mode==='hvh')pts.push({x:mx,y:a.y},{x:mx,y:b.y});
    else if(mode==='vhv')pts.push({x:a.x,y:my},{x:b.x,y:my});
    else if(mode==='vhh')pts.push({x:a.x,y:my},{x:b.x,y:my});
    else if(mode==='vhhL')pts.push({x:a.x,y:my},{x:b.x-28,y:my},{x:b.x-28,y:b.y});
    else if(mode==='vhhR')pts.push({x:a.x,y:my},{x:b.x+28,y:my},{x:b.x+28,y:b.y});
    else pts.push({x:b.x,y:a.y});
    pts.push(b);
    drawPath(pts);
}
function labelText(x,y,text,font='8px "Segoe UI",Arial,sans-serif'){
    g.font=font;
    g.fillStyle='#000';
    g.fillText(text,x,y);
}
function cardText(start,end,value){
    const dx=end.x-start.x,dy=end.y-start.y,len=Math.sqrt(dx*dx+dy*dy)||1;
    const px=-dy/len*8,py=dx/len*8;
    const x=start.x+(dx/len)*18+px,y=start.y+(dy/len)*18+py;
    g.textAlign='center';
    g.textBaseline='middle';
    labelText(x,y,value,'bold 8px "Segoe UI",Arial,sans-serif');
}
function attrList(e){
    const all=[];
    e.pk.forEach(n=>all.push({n,t:'pk'}));
    e.fk.forEach(n=>all.push({n,t:'fk'}));
    e.a.forEach(n=>all.push({n,t:'n'}));
    return all;
}
function stackAttrs(e,items,x){
    const step=e.step||15,start=e.y-(items.length-1)*step/2;
    return items.map((a,i)=>({...a,x,y:start+i*step,ex:e.x,ey:e.y}));
}
function attrPositions(e){
    const all=attrList(e),gap=e.gap||104;
    if(e.side==='left')return stackAttrs(e,all,e.x-gap);
    if(e.side==='right')return stackAttrs(e,all,e.x+gap);
    const left=all.slice(0,Math.ceil(all.length/2));
    const right=all.slice(Math.ceil(all.length/2));
    return stackAttrs(e,left,e.x-gap).concat(stackAttrs(e,right,e.x+gap));
}
function moduleBox(x,y,w,h,label){
    g.save();
    g.strokeStyle='#d0d0d0';
    g.lineWidth=LINE;
    g.strokeRect(x,y,w,h);
    g.fillStyle='#555';
    g.font='bold 9px "Segoe UI",Arial,sans-serif';
    g.textAlign='left';
    g.textBaseline='middle';
    g.fillText(label,x+8,y+13);
    g.restore();
}

moduleBox(62,96,1116,455,'A. Master Data');
moduleBox(62,570,1116,670,'B. Operasional, Absensi, dan Laporan');
moduleBox(62,1260,1116,395,'C. Preventive Maintenance');
const PORTS=buildPortSlots();

g.strokeStyle='#d8d8d8';
g.lineWidth=LINE;
g.beginPath();g.moveTo(62,565);g.lineTo(1178,565);g.stroke();
g.beginPath();g.moveTo(62,1252);g.lineTo(1178,1252);g.stroke();

// 1. Relationship lines are drawn first so entities and attributes stay readable.
g.strokeStyle='#000';
g.lineWidth=LINE;
R.forEach((r,i)=>{
    const d=relBox(r);
    const fs=endpointFor(r,i,'f',d,PORTS),ts=endpointFor(r,i,'t',d,PORTS),fd=dp(d,fs),td=dp(d,ts);
    stepPath(fs,fd,r.a);
    stepPath(td,ts,r.b);
});

// 2. Relationship diamonds and cardinalities.
R.forEach((r,i)=>{
    const d=relBox(r);
    const fs=endpointFor(r,i,'f',d,PORTS),ts=endpointFor(r,i,'t',d,PORTS),fd=dp(d,fs),td=dp(d,ts);
    g.fillStyle='#fff';
    g.strokeStyle='#000';
    g.lineWidth=LINE;
    diamond(d.x,d.y,d.hw,d.hh);
    g.fill();g.stroke();
    g.fillStyle='#000';
    g.font=REL_FONT;
    g.textAlign='center';
    g.textBaseline='middle';
    g.fillText(r.l,d.x,d.y);
    cardText(fs,fd,r.c1);
    cardText(ts,td,r.c2);
});

// 3. Attribute connector lines.
g.strokeStyle='#555';
g.lineWidth=LINE;
E.forEach(e=>attrPositions(e).forEach(a=>{
    g.beginPath();
    g.moveTo(a.x,a.y);
    g.lineTo(a.ex,a.ey);
    g.stroke();
}));

// 4. Attribute ellipses.
E.forEach(e=>attrPositions(e).forEach(a=>{
    const aw=Math.max(tw(a.n,7.5)+12,36),ah=12;
    g.fillStyle='#fff';
    g.strokeStyle='#000';
    g.lineWidth=LINE;
    ellipse(a.x,a.y,aw/2,ah/2);
    g.fill();g.stroke();
    g.fillStyle='#000';
    g.textAlign='center';
    g.textBaseline='middle';
    g.font=a.t==='pk'?'bold 7.5px "Segoe UI",Arial,sans-serif':a.t==='fk'?'italic 7.5px "Segoe UI",Arial,sans-serif':'7.5px "Segoe UI",Arial,sans-serif';
    g.fillText(a.n,a.x,a.y);
    if(a.t==='pk'){
        const w=g.measureText(a.n).width;
        g.beginPath();
        g.moveTo(a.x-w/2,a.y+4.2);
        g.lineTo(a.x+w/2,a.y+4.2);
        g.lineWidth=LINE;
        g.stroke();
    }
}));

// 5. Entity boxes.
E.forEach(e=>{
    const s=entitySize(e);
    g.fillStyle='#fff';
    g.strokeStyle='#000';
    g.lineWidth=LINE;
    g.fillRect(e.x-s.w/2,e.y-s.h/2,s.w,s.h);
    g.strokeRect(e.x-s.w/2,e.y-s.h/2,s.w,s.h);
    g.fillStyle='#000';
    g.font='bold 11px "Segoe UI",Arial,sans-serif';
    g.textAlign='center';
    g.textBaseline='middle';
    g.fillText(e.l,e.x,e.y);
});
