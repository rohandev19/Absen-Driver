<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case Diagram Bersih - Sistem Absensi dan Manajemen Armada</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f4f6;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }
        header {
            padding: 16px 26px;
            background: #fff;
            border-bottom: 1px solid #d1d5db;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        h1 {
            margin: 0;
            font-size: 21px;
        }
        .hint {
            margin-top: 6px;
            color: #555;
            font-size: 13px;
        }
        .page {
            width: 1120px;
            margin: 24px auto;
            padding: 18px;
            background: #fff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        .page-title {
            margin: 0 0 12px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
            background: #fff;
        }
        .boundary {
            fill: #fff;
            stroke: #000;
            stroke-width: 2;
        }
        .boundary-label {
            font-size: 15px;
            font-weight: 700;
            text-anchor: middle;
        }
        .actor-line,
        .assoc-line,
        .dep-line {
            stroke: #000;
            fill: none;
        }
        .actor-line { stroke-width: 2; }
        .assoc-line { stroke-width: 1.35; }
        .dep-line {
            stroke-width: 1.25;
            stroke-dasharray: 6 4;
            marker-end: url(#arrow);
        }
        .usecase ellipse {
            fill: #fff;
            stroke: #000;
            stroke-width: 1.5;
        }
        .usecase text {
            font-size: 12px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .actor-label {
            font-size: 12px;
            font-weight: 700;
            text-anchor: middle;
        }
        .relation-label {
            font-size: 11px;
            font-style: italic;
            fill: #111;
            text-anchor: middle;
        }
        @media print {
            body { background: #fff; }
            header { display: none; }
            .page {
                width: 100%;
                margin: 0;
                border: none;
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>
